name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No test suite yet; this catches syntax errors in the server and functions.
      - name: Syntax check JavaScript
        run: |
          for f in server.js netlify/functions/*.js; do
            node --check "$f"
          done
